kind = "web"
previewPath = "/ok-cellular-landing/"
title = "OK Cellular Landing Page"
version = "1.0.0"
id = "artifacts/ok-cellular-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/ok-cellular-landing/" ]
localPort = 23231

[services.development]
run = "pnpm --filter @workspace/ok-cellular-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ok-cellular-landing", "run", "build" ]
publicDir = "artifacts/ok-cellular-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23231"
BASE_PATH = "/ok-cellular-landing/"
