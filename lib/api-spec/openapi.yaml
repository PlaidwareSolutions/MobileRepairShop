openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Gadget X Repairs API — lead capture, inventory browse, admin leads view.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead-capture endpoints (public)
  - name: inventory
    description: Inventory browse (public)
  - name: admin
    description: Admin leads view (password-gated)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /leads/repair-quote:
    post:
      operationId: submitRepairQuote
      tags: [leads]
      summary: Submit a repair quote request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepairQuoteInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /leads/sell-phone:
    post:
      operationId: submitSellPhone
      tags: [leads]
      summary: Submit a sell-your-phone offer request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellPhoneInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /leads/appointment:
    post:
      operationId: submitAppointment
      tags: [leads]
      summary: Book a repair appointment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /leads/contact:
    post:
      operationId: submitContact
      tags: [leads]
      summary: Send a contact message
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /leads/reservation:
    post:
      operationId: submitReservation
      tags: [leads]
      summary: Reserve an inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List inventory items
      parameters:
        - in: query
          name: category
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Inventory list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryItem" }
  /inventory/{id}:
    get:
      operationId: getInventoryItem
      tags: [inventory]
      summary: Get a single inventory item by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Inventory item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryItem" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/leads:
    get:
      operationId: getAdminLeads
      tags: [admin]
      summary: Get all leads grouped by type (password-gated)
      parameters:
        - in: header
          name: X-Admin-Password
          required: true
          schema: { type: string }
      responses:
        "200":
          description: All leads grouped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLeads" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/leads/{leadType}/{id}/status:
    patch:
      operationId: updateLeadStatus
      tags: [admin]
      summary: Update a lead status (password-gated)
      parameters:
        - in: header
          name: X-Admin-Password
          required: true
          schema: { type: string }
        - in: path
          name: leadType
          required: true
          schema:
            type: string
            enum:
              - repair-quote
              - sell-phone
              - appointment
              - contact
              - reservation
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadStatusUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/anti-spam/stats:
    get:
      operationId: getAntiSpamStats
      tags: [admin]
      summary: Get accepted-vs-blocked lead counts for the anti-spam tile
      parameters:
        - in: header
          name: X-Admin-Password
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Anti-spam stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AntiSpamStats" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/messaging/config:
    get:
      operationId: getMessagingConfig
      tags: [admin]
      summary: Get whether email and SMS sending are configured
      parameters:
        - in: header
          name: X-Admin-Password
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Messaging config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagingConfig" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/leads/{leadType}/{id}/activity:
    get:
      operationId: getLeadActivity
      tags: [admin]
      summary: Get communication activity for a single lead
      parameters:
        - in: header
          name: X-Admin-Password
          required: true
          schema: { type: string }
        - in: path
          name: leadType
          required: true
          schema:
            type: string
            enum:
              - repair-quote
              - sell-phone
              - appointment
              - contact
              - reservation
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadActivityResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/leads/{leadType}/{id}/email:
    post:
      operationId: sendLeadEmail
      tags: [admin]
      summary: Send an email reply to a lead
      parameters:
        - in: header
          name: X-Admin-Password
          required: true
          schema: { type: string }
        - in: path
          name: leadType
          required: true
          schema:
            type: string
            enum:
              - repair-quote
              - sell-phone
              - appointment
              - contact
              - reservation
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendEmailInput" }
      responses:
        "200":
          description: Send result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendResult" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/leads/{leadType}/{id}/sms:
    post:
      operationId: sendLeadSms
      tags: [admin]
      summary: Send an SMS reply to a lead
      parameters:
        - in: header
          name: X-Admin-Password
          required: true
          schema: { type: string }
        - in: path
          name: leadType
          required: true
          schema:
            type: string
            enum:
              - repair-quote
              - sell-phone
              - appointment
              - contact
              - reservation
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendSmsInput" }
      responses:
        "200":
          description: Send result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendResult" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /webhooks/resend:
    post:
      operationId: resendWebhook
      tags: [webhooks]
      summary: Resend delivery-status webhook (signature-verified)
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookAck" }
        "401":
          description: Invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /webhooks/telnyx:
    post:
      operationId: telnyxWebhook
      tags: [webhooks]
      summary: Telnyx delivery-status webhook (signature-verified)
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookAck" }
        "401":
          description: Invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    SubmitResponse:
      type: object
      properties:
        ok: { type: boolean }
        id: { type: integer }
      required: [ok]
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        details: { type: object, additionalProperties: true }
      required: [error]
    RepairQuoteInput:
      type: object
      required: [name, phone, deviceType, brand, model, problem]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, minLength: 7, maxLength: 40 }
        email: { type: string, maxLength: 200 }
        deviceType: { type: string, minLength: 1, maxLength: 80 }
        brand: { type: string, minLength: 1, maxLength: 80 }
        model: { type: string, minLength: 1, maxLength: 120 }
        problem: { type: string, minLength: 1, maxLength: 4000 }
        preferredContact:
          type: string
          enum: [call, text, whatsapp, email]
        urgency:
          type: string
          enum: [asap, today, this_week, flexible]
        notes: { type: string, maxLength: 2000 }
        photoUrl: { type: string, maxLength: 500 }
        source:
          type: string
          enum: [in-store, mail-in]
        returnAddress: { type: string, maxLength: 500 }
    SellPhoneInput:
      type: object
      required: [name, phone, brand, model]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, minLength: 7, maxLength: 40 }
        brand: { type: string, minLength: 1, maxLength: 80 }
        model: { type: string, minLength: 1, maxLength: 120 }
        storage: { type: string, maxLength: 40 }
        carrier: { type: string, maxLength: 80 }
        lockedStatus:
          type: string
          enum: [locked, unlocked]
        condition:
          type: string
          enum: [mint, good, fair, broken]
        batteryHealth: { type: integer, minimum: 0, maximum: 100 }
        damageNotes: { type: string, maxLength: 2000 }
        expectedPrice: { type: string, maxLength: 20 }
        photoUrl: { type: string, maxLength: 500 }
    AppointmentInput:
      type: object
      required: [name, phone, serviceType, preferredDatetime]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, minLength: 7, maxLength: 40 }
        serviceType:
          type: string
          enum:
            - screen-repair
            - battery-replacement
            - hdmi-repair
            - laptop-diagnostic
            - motherboard-repair
            - phone-unlocking
            - prepaid-activation
        preferredDatetime: { type: string, minLength: 1, maxLength: 80 }
        notes: { type: string, maxLength: 2000 }
    ContactInput:
      type: object
      required: [name, contact, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        contact: { type: string, minLength: 3, maxLength: 200 }
        message: { type: string, minLength: 1, maxLength: 4000 }
        # Where the lead came from. "contact" is the generic contact form;
        # "financing" is the phone-financing pre-qualification form. Optional
        # on input — the server defaults a missing field to "contact" so
        # legacy callers and the plain ContactForm keep working without
        # sending the field. Values outside the enum are rejected by the
        # request validator (400) before the default ever applies.
        source:
          type: string
          enum: [contact, financing]
    ReservationInput:
      type: object
      required: [name, phone, itemId, itemLabel]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, minLength: 7, maxLength: 40 }
        itemId: { type: string, minLength: 1, maxLength: 120 }
        itemLabel: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: string, maxLength: 1000 }
    InventoryItem:
      type: object
      required: [id, category, brand, model, price]
      properties:
        id: { type: string }
        category: { type: string }
        brand: { type: string }
        model: { type: string }
        storage: { type: string }
        color: { type: string }
        condition: { type: string }
        carrier: { type: string }
        price: { type: string }
        warranty: { type: string }
        availability: { type: string }
        imageUrl: { type: string }
        description: { type: string }
    LeadBase:
      type: object
      properties:
        id: { type: integer }
        status: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, status, createdAt, updatedAt]
    RepairQuoteRecord:
      allOf:
        - $ref: "#/components/schemas/LeadBase"
        - $ref: "#/components/schemas/RepairQuoteInput"
    SellPhoneRecord:
      allOf:
        - $ref: "#/components/schemas/LeadBase"
        - $ref: "#/components/schemas/SellPhoneInput"
    AppointmentRecord:
      allOf:
        - $ref: "#/components/schemas/LeadBase"
        - $ref: "#/components/schemas/AppointmentInput"
    ContactRecord:
      allOf:
        - $ref: "#/components/schemas/LeadBase"
        - $ref: "#/components/schemas/ContactInput"
    ReservationRecord:
      allOf:
        - $ref: "#/components/schemas/LeadBase"
        - $ref: "#/components/schemas/ReservationInput"
    LeadStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new, in_progress, done, archived]
    MessagingConfig:
      type: object
      required: [emailEnabled, smsEnabled, mailFrom, smsFrom]
      properties:
        emailEnabled: { type: boolean }
        smsEnabled: { type: boolean }
        mailFrom: { type: string }
        smsFrom: { type: string }
    LeadCommunication:
      type: object
      required:
        [
          id,
          leadType,
          leadId,
          channel,
          direction,
          body,
          recipient,
          status,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        leadType:
          type: string
          enum:
            - repair-quote
            - sell-phone
            - appointment
            - contact
            - reservation
        leadId: { type: string }
        channel:
          type: string
          enum: [email, sms]
        direction:
          type: string
          enum: [outbound, inbound]
        subject: { type: string, nullable: true }
        body: { type: string }
        recipient: { type: string }
        providerMessageId: { type: string, nullable: true }
        status: { type: string }
        error: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }
    LeadActivityResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LeadCommunication" }
    SendEmailInput:
      type: object
      required: [to, subject]
      properties:
        to: { type: string, minLength: 3, maxLength: 200 }
        subject: { type: string, minLength: 1, maxLength: 200 }
        html: { type: string, maxLength: 20000 }
        text: { type: string, maxLength: 20000 }
    SendSmsInput:
      type: object
      required: [to, body]
      properties:
        to: { type: string, minLength: 7, maxLength: 40 }
        body: { type: string, minLength: 1, maxLength: 1600 }
    SendResult:
      type: object
      required: [ok, status]
      properties:
        ok: { type: boolean }
        id: { type: integer }
        providerMessageId: { type: string, nullable: true }
        status: { type: string, enum: [queued, sent, failed] }
        error: { type: string, nullable: true }
    WebhookAck:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    AdminLeads:
      type: object
      required:
        [
          repairQuotes,
          sellPhoneSubmissions,
          appointments,
          contactMessages,
          itemReservations,
        ]
      properties:
        repairQuotes:
          type: array
          items: { $ref: "#/components/schemas/RepairQuoteRecord" }
        sellPhoneSubmissions:
          type: array
          items: { $ref: "#/components/schemas/SellPhoneRecord" }
        appointments:
          type: array
          items: { $ref: "#/components/schemas/AppointmentRecord" }
        contactMessages:
          type: array
          items: { $ref: "#/components/schemas/ContactRecord" }
        itemReservations:
          type: array
          items: { $ref: "#/components/schemas/ReservationRecord" }
    AntiSpamWindow:
      type: object
      required:
        [
          key,
          days,
          acceptedLeads,
          turnstileFailures,
          honeypotTrips,
          rateLimitBlocks,
        ]
      properties:
        key: { type: string }
        days: { type: integer }
        acceptedLeads: { type: integer }
        turnstileFailures: { type: integer }
        honeypotTrips: { type: integer }
        rateLimitBlocks: { type: integer }
    AntiSpamStats:
      type: object
      required: [windows]
      properties:
        windows:
          type: array
          items: { $ref: "#/components/schemas/AntiSpamWindow" }
