openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Gadget X Repairs API — lead capture, inventory browse, admin leads view.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead-capture endpoints (public)
  - name: inventory
    description: Inventory browse (public)
  - name: admin
    description: Admin leads view (password-gated)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /leads/repair-quote:
    post:
      operationId: submitRepairQuote
      tags: [leads]
      summary: Submit a repair quote request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepairQuoteInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /leads/sell-phone:
    post:
      operationId: submitSellPhone
      tags: [leads]
      summary: Submit a sell-your-phone offer request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellPhoneInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /leads/appointment:
    post:
      operationId: submitAppointment
      tags: [leads]
      summary: Book a repair appointment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /leads/contact:
    post:
      operationId: submitContact
      tags: [leads]
      summary: Send a contact message
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /leads/reservation:
    post:
      operationId: submitReservation
      tags: [leads]
      summary: Reserve an inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List inventory items
      parameters:
        - in: query
          name: category
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Inventory list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryItem" }
  /admin/leads:
    get:
      operationId: getAdminLeads
      tags: [admin]
      summary: Get all leads grouped by type (password-gated)
      parameters:
        - in: header
          name: X-Admin-Password
          required: true
          schema: { type: string }
      responses:
        "200":
          description: All leads grouped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLeads" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/leads/{leadType}/{id}/status:
    patch:
      operationId: updateLeadStatus
      tags: [admin]
      summary: Update a lead status (password-gated)
      parameters:
        - in: header
          name: X-Admin-Password
          required: true
          schema: { type: string }
        - in: path
          name: leadType
          required: true
          schema:
            type: string
            enum:
              - repair-quote
              - sell-phone
              - appointment
              - contact
              - reservation
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadStatusUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    SubmitResponse:
      type: object
      properties:
        ok: { type: boolean }
        id: { type: integer }
      required: [ok]
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        details: { type: object, additionalProperties: true }
      required: [error]
    RepairQuoteInput:
      type: object
      required: [name, phone, deviceType, brand, model, problem]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, minLength: 7, maxLength: 40 }
        email: { type: string, maxLength: 200 }
        deviceType: { type: string, minLength: 1, maxLength: 80 }
        brand: { type: string, minLength: 1, maxLength: 80 }
        model: { type: string, minLength: 1, maxLength: 120 }
        problem: { type: string, minLength: 1, maxLength: 4000 }
        preferredContact:
          type: string
          enum: [call, text, whatsapp, email]
        urgency:
          type: string
          enum: [asap, today, this_week, flexible]
        notes: { type: string, maxLength: 2000 }
    SellPhoneInput:
      type: object
      required: [name, phone, brand, model]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, minLength: 7, maxLength: 40 }
        brand: { type: string, minLength: 1, maxLength: 80 }
        model: { type: string, minLength: 1, maxLength: 120 }
        storage: { type: string, maxLength: 40 }
        carrier: { type: string, maxLength: 80 }
        lockedStatus:
          type: string
          enum: [locked, unlocked]
        condition:
          type: string
          enum: [mint, good, fair, broken]
        batteryHealth: { type: integer, minimum: 0, maximum: 100 }
        damageNotes: { type: string, maxLength: 2000 }
        expectedPrice: { type: string, maxLength: 20 }
    AppointmentInput:
      type: object
      required: [name, phone, serviceType, preferredDatetime]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, minLength: 7, maxLength: 40 }
        serviceType:
          type: string
          enum:
            - screen-repair
            - battery-replacement
            - hdmi-repair
            - laptop-diagnostic
            - motherboard-repair
            - phone-unlocking
            - prepaid-activation
        preferredDatetime: { type: string, minLength: 1, maxLength: 80 }
        notes: { type: string, maxLength: 2000 }
    ContactInput:
      type: object
      required: [name, contact, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        contact: { type: string, minLength: 3, maxLength: 200 }
        message: { type: string, minLength: 1, maxLength: 4000 }
    ReservationInput:
      type: object
      required: [name, phone, itemId, itemLabel]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, minLength: 7, maxLength: 40 }
        itemId: { type: string, minLength: 1, maxLength: 120 }
        itemLabel: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: string, maxLength: 1000 }
    InventoryItem:
      type: object
      required: [id, category, brand, model, price]
      properties:
        id: { type: string }
        category: { type: string }
        brand: { type: string }
        model: { type: string }
        storage: { type: string }
        color: { type: string }
        condition: { type: string }
        carrier: { type: string }
        price: { type: string }
        warranty: { type: string }
        availability: { type: string }
    LeadBase:
      type: object
      properties:
        id: { type: integer }
        status: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, status, createdAt, updatedAt]
    RepairQuoteRecord:
      allOf:
        - $ref: "#/components/schemas/LeadBase"
        - $ref: "#/components/schemas/RepairQuoteInput"
    SellPhoneRecord:
      allOf:
        - $ref: "#/components/schemas/LeadBase"
        - $ref: "#/components/schemas/SellPhoneInput"
    AppointmentRecord:
      allOf:
        - $ref: "#/components/schemas/LeadBase"
        - $ref: "#/components/schemas/AppointmentInput"
    ContactRecord:
      allOf:
        - $ref: "#/components/schemas/LeadBase"
        - $ref: "#/components/schemas/ContactInput"
    ReservationRecord:
      allOf:
        - $ref: "#/components/schemas/LeadBase"
        - $ref: "#/components/schemas/ReservationInput"
    LeadStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new, contacted, handled]
    AdminLeads:
      type: object
      required: [repairQuotes, sellPhone, appointments, contact, reservations]
      properties:
        repairQuotes:
          type: array
          items: { $ref: "#/components/schemas/RepairQuoteRecord" }
        sellPhone:
          type: array
          items: { $ref: "#/components/schemas/SellPhoneRecord" }
        appointments:
          type: array
          items: { $ref: "#/components/schemas/AppointmentRecord" }
        contact:
          type: array
          items: { $ref: "#/components/schemas/ContactRecord" }
        reservations:
          type: array
          items: { $ref: "#/components/schemas/ReservationRecord" }
